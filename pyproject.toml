[project]
name = "resume-builder-skill"
description = "Agent skill that creates tailored, ATS-friendly software engineer resumes"
readme = "readme.md"
requires-python = ">=3.8"
dynamic = ["version"]
dependencies = [
    "python-docx>=1.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
]

# The skill is a folder of scripts, not an installable package: agents run
# `python3 scripts/<tool>.py` from wherever the skill is installed.
[tool.uv]
package = false

# Single source of truth for the version: scripts/axi.py. The build backend
# is only ever consulted to read that version, never to build a wheel.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "scripts/axi.py"

[tool.ruff]
line-length = 110

# Rules that catch real bugs (unused names, mutable defaults, blind excepts,
# duplicate set items), not style churn.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "SIM", "RUF", "EXE"]
ignore = ["B008", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# The output layer is imported by path, so the import cannot sit at the top.
"scripts/test_axi.py" = ["E402"]
