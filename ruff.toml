# Lint gate for this skill's scripts. Kept deliberately small: rules that catch
# real bugs (unused names, mutable defaults, blind excepts, duplicate set
# items), not style churn. Run with: uvx ruff check scripts/
[lint]
select = ["E4", "E7", "E9", "F", "B", "SIM", "RUF", "EXE"]
ignore = ["B008", "RUF100"]

[lint.per-file-ignores]
# The output layer is imported by path, so the import cannot sit at the top.
"scripts/test_axi.py" = ["E402"]
